# Publica una versión de MemoriaCalc:
#  - al subir una etiqueta v* (p. ej. v2.0.0), o
#  - con un commit cuyo mensaje contenga [release vX.Y.Z] en cualquier rama
name: Release
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: { description: 'Versión (p. ej. v2.0.0)', required: true }
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    steps:
      - name: Versión
        id: ver
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/}";
          elif [[ -n "$INPUT" ]]; then V="$INPUT";
          else V=$(echo "$MSG" | grep -o '\[release v[0-9][0-9.]*\]' | head -1 | sed 's/\[release //; s/\]//'); fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Compilar la app web
        run: node build.mjs
      - name: Pruebas
        run: node tests/run.mjs
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: Ícono y ejecutable de Windows
        run: |
          pip install pillow
          python3 mkico.py
          cp dist/MemoriaCalc.html app.html
          GO111MODULE=off GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o dist/MemoriaCalc.exe .
      - name: Paquete
        run: |
          mkdir -p pkg/MemoriaCalc
          cp dist/MemoriaCalc.exe dist/MemoriaCalc.html LEEME.md pkg/MemoriaCalc/
          (cd pkg && zip -r ../MemoriaCalc-windows.zip MemoriaCalc)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: MemoriaCalc ${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          files: |
            MemoriaCalc-windows.zip
            dist/MemoriaCalc.exe
            dist/MemoriaCalc.html
